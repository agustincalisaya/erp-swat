version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: swat_erp_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: erpswat
      POSTGRES_PASSWORD: erpswat
      POSTGRES_DB: swat_erp_db
    volumes:
      - swat_erp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpswat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  swat_erp_db_data: