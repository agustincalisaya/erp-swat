schema: spec-driven

context: |
  Project: SWAT Indumentarias ERP (erp-swat) — branch HU-A6, Módulo A (Inventario).
  Stack: Next.js 16.3.0 (App Router), React 19, TypeScript 5, Prisma v6 + PostgreSQL 16 (Docker), Tailwind v4, shadcn/Base UI, Zod v3, react-hook-form.
  Architecture: Server Actions + route handlers; domain services in src/lib/services/inventario; domain event bus (13 events) with audit-log.listener.ts as sole AuditLog writer.
  Conventions: strict soft delete (never DELETE; UPDATE is_active/deleted_at/deleted_by/deletion_reason), onDelete Restrict, immutable MovimientoStock, audit via domain events only.
  Testing: unit runner exists (node:test via tsx — npm test, 1 file, 7 tests, no coverage); lint + build are the primary gates.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Scope strictly to HU-A6 (soft delete de variantes); do not touch HU-A3, HU-A7, Módulo D, HU-MA2
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - HU-A6 contract: docs/specs/spec_modulo_A.md §2.5/§3.5/§4 and docs/specs/spec_modulo_D.md §4
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Follow existing event pattern: event-types.ts -> domain-event-bus.ts -> audit-log.listener.ts
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Soft delete updates only the 4 fields; never mutate StockDeposito/MovimientoStock
      - Emit event AFTER transaction resolves, never inside $transaction
      - Take usuario_id from session for deleted_by
    tdd: false
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    lint_command: "npm run lint"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas